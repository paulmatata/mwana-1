; Defaults (upload_max_filesize=2M, post_max_size=8M, memory_limit often 128M) are
; too small for Excel bulk-import uploads and PhpSpreadsheet's memory usage while
; parsing. Without this, a bulk import can fail with a vague/confusing error
; rather than Laravel's own clearer validation message.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
